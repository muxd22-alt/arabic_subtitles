name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Verify bundled engine libs
      run: node scripts/verify-engine-libs.mjs

    - name: Build with Gradle
      run: gradle assembleDebug testDebugUnitTest

    - name: Assert APK carries the engine
      run: |
        apk=app/build/outputs/apk/debug/app-debug.apk
        unzip -l "$apk" > /tmp/apk-contents.txt
        for lib in libllama-server.so libwhisper-cli.so libffmpeg.so libffprobe.so; do
          if ! grep -q "lib/arm64-v8a/$lib" /tmp/apk-contents.txt; then
            echo "MISSING from APK: lib/arm64-v8a/$lib"
            exit 1
          fi
        done
        echo "all required engine libs present in the APK"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ArabicSubs-APK
        path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Every release APK must carry the SAME signing key, or Android refuses the
      # update ("it is signed with a different key"). The key lives in the
      # KEYSTORE_* secrets and is decoded here; without them Gradle falls back to
      # the debug key and only the first install will ever succeed.
      - name: Restore release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p .signing
          echo "$KEYSTORE_BASE64" | base64 --decode > .signing/release.jks
          printf 'storeFile=.signing/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "release keystore restored"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Determine Version and Rename APK
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            # 2.2.0 -> v2.2: the release label drops a trailing ".0"
            RELEASE_TAG="v${PKG_VER%.0}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/ArabicSubs_${RELEASE_TAG}.apk"

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/ArabicSubs_${{ env.RELEASE_TAG }}.apk
          generate_release_notes: true
          name: "Arabic Subs ${{ env.RELEASE_TAG }}"
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
